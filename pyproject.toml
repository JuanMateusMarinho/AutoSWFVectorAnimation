[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoswf"
version = "0.1.0"
description = "Turn layered cel-shaded art into AQW-ready vector SWF items"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8", "numpy>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["aqw: needs AQW reference files downloaded with `python -m autoswf download-aqw` (skipped otherwise)"]
